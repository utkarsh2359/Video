      html,

        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0b0c;

      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        --bg: #0b0b0c;
        --card: #1a1a1c;
        --card-edge: rgba(255, 255, 255, 0.1);
        --ink: #ffffff;
        --muted: #a0a0a6;
        --accent: #d0243a;
        --glow: rgba(255, 59, 78, 0.5);
        --dot: rgba(255, 255, 255, 0.07);

        background:
          radial-gradient(circle, var(--dot) 1.2px, transparent 1.6px) 0 0 /
            24px 24px,
          var(--bg);
      }
      #bgglow {
        position: absolute;
        left: -300px;
        top: 100px;
        width: 1100px;
        height: 1100px;
        z-index: 0;
        background: radial-gradient(
          circle,
          rgba(208, 36, 58, 0.16),
          transparent 65%
        );
        pointer-events: none;
      }
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        background: radial-gradient(
          ellipse at 50% 40%,
          transparent 55%,
          rgba(0, 0, 0, 0.65) 100%
        );
      }
      #stage > .clip {
        z-index: 2;
      }
      #face {
        position: absolute;
        z-index: 3;
        overflow: hidden;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
      }
      #face-inner {
        position: absolute;
      }
      #face-zoom {
        position: absolute;
        inset: 0;
        transform-origin: 50% 24%;
      }
      #aroll {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #stage > #captions-host {
        z-index: 4;
      }
    </style>
